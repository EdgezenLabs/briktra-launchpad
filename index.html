    <!--
      WEB-008: partial mitigation only. GitHub Pages cannot send custom
      HTTP response headers at all, so HSTS, X-Frame-Options, and
      Permissions-Policy CANNOT be set here -- those genuinely require
      moving to a host that supports response headers (Netlify/Vercel/
      Cloudflare Pages/a reverse proxy), which is a hosting decision.
      Content-Security-Policy and Referrer-Policy DO work as <meta>
      tags (per the CSP spec, everything except frame-ancestors, which
      browsers silently ignore outside a real header -- so it's
      deliberately omitted here rather than included as false comfort).
      script-src needs 'unsafe-inline' for the inline gtag bootstrap
      script below; tightening that further would need moving it to a
      nonced/hashed script, out of scope for this pass.
    -->
